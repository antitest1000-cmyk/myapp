<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ccBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6BFF"/>
      <stop offset="50%" stop-color="#5B4BF5"/>
      <stop offset="100%" stop-color="#7B3FF2"/>
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="ccGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Checkerboard Pattern -->
    <pattern id="ccChecker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="12" width="12" height="12" fill="#E2E8F0"/>
      <rect y="12" width="12" height="12" fill="#E2E8F0"/>
      <rect x="12" y="12" width="12" height="12" fill="#FFFFFF" fill-opacity="0.9"/>
    </pattern>

    <!-- Inner Shadow / Bevel Filter -->
    <filter id="ccShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2F6BFF" flood-opacity="0.45"/>
    </filter>

    <filter id="cutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ccBgGrad)" filter="url(#ccShadow)"/>

  <!-- Subtle Glass Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Checkerboard reveal area on right corner -->
  <g clip-path="url(#cornerClip)">
    <clipPath id="cornerClip">
      <path d="M 280 32 L 480 32 A 112 112 0 0 1 480 320 L 280 32 Z"/>
    </clipPath>
    <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ccChecker)" opacity="0.22"/>
  </g>

  <!-- Decorative cutting line with glow -->
  <path d="M 120 420 L 392 90" stroke="url(#ccGlowGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Stylized Eraser Tool -->
  <g transform="translate(140, 110)">
    <!-- Eraser Body Angle 38deg -->
    <g transform="rotate(38 120 120)">
      <!-- Eraser Back Pink Accent -->
      <rect x="70" y="30" width="70" height="60" rx="12" fill="#FF4D8D"/>
      <!-- Eraser Band (silver) -->
      <rect x="70" y="85" width="70" height="22" rx="4" fill="url(#metalGrad)"/>
      <line x1="70" y1="96" x2="140" y2="96" stroke="#9CA3AF" stroke-width="2"/>
      <!-- Eraser Front Clean White -->
      <path d="M 70 107 L 140 107 L 132 195 A 16 16 0 0 1 116 208 L 94 208 A 16 16 0 0 1 78 195 Z" fill="#FFFFFF"/>
      
      <!-- Checkerboard fade trail at eraser tip -->
      <rect x="78" y="160" width="14" height="14" fill="#2F6BFF" opacity="0.35"/>
      <rect x="106" y="148" width="14" height="14" fill="#2F6BFF" opacity="0.35"/>
      <rect x="92" y="174" width="14" height="14" fill="#2F6BFF" opacity="0.35"/>
    </g>
  </g>

  <!-- Glowing Green/White Checkmark -->
  <g transform="translate(260, 260)" filter="url(#cutGlow)">
    <circle cx="90" cy="90" r="58" fill="#10B981" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 68 90 L 83 105 L 115 72" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Glass Sheen -->
  <path d="M 32 144 C 32 82 82 32 144 32 L 368 32 C 400 32 300 160 160 220 C 60 260 32 180 32 144 Z" fill="#FFFFFF" opacity="0.12"/>
</svg>
